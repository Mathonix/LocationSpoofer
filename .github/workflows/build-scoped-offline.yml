name: Build scoped offline-first APK

on:
  push:
    branches:
      - offline/scoped-first
    paths:
      - 'tools/offline_patch.py'
      - '.github/workflows/build-scoped-offline.yml'
      - 'app/**'
      - 'app-ui/**'
      - 'service/**'
      - 'xposed/**'
      - 'core-data/**'
      - 'core-geo/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout public fork source
        uses: actions/checkout@v4

      - name: Check offline patch syntax
        run: python3 -m py_compile tools/offline_patch.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK from preinstalled command-line tools
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -f "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply scoped offline-first changes
        run: python3 tools/offline_patch.py --root .

      - name: Compile against available Android SDK 36 (upstream uses 37)
        shell: bash
        run: |
          for file in app/build.gradle.kts app-ui/build.gradle.kts service/build.gradle.kts core-data/build.gradle.kts xposed/build.gradle.kts; do
            sed -i 's/compileSdk = 37/compileSdk = 36/g; s/targetSdk = 37/targetSdk = 36/g' "$file"
          done

      - name: Build scoped debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleScopedDebug --stacktrace

      - name: Upload scoped debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-scoped-offline-first-debug
          path: app/build/outputs/apk/scoped/debug/*.apk
          if-no-files-found: error
